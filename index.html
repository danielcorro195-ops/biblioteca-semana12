<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Escolar - Semana 12</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f8f9fa;
    transition:0.3s;
}

.card-header{
    background:#0d6efd;
    color:white;
}

.dark-mode{
    background:#212529 !important;
    color:white;
}

.dark-mode .card{
    background:#343a40;
    color:white;
}

.dark-mode .table{
    color:white;
}

.dark-mode .modal-content{
    background:#343a40;
    color:white;
}
</style>

</head>
<body>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h2>📚 Biblioteca Escolar - Sistema de Gestión</h2>
        </div>

        <div class="card-body">

            <div class="mb-3">

                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#modalLibro"
                    aria-label="Agregar nuevo libro">
                    ➕ Agregar Nuevo Libro
                </button>

                <button
                    class="btn btn-dark"
                    onclick="cambiarTema()"
                    aria-label="Cambiar tema">
                    🌙 Tema Oscuro/Claro
                </button>

                <button
                    class="btn btn-success"
                    onclick="mostrarReporte()"
                    aria-label="Ver reporte">
                    📊 Reporte Más Leídos
                </button>

            </div>

            <div id="alertas"></div>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Año</th>
                            <th>Categoría</th>
                            <th>Estado</th>
                            <th>Lecturas</th>
                        </tr>

                    </thead>

                    <tbody id="cuerpoTabla"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- Modal -->

<div
class="modal fade"
id="modalLibro"
tabindex="-1"
aria-labelledby="tituloModal"
aria-hidden="true">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header bg-primary text-white">

<h5 class="modal-title" id="tituloModal">
Agregar Nuevo Libro
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="formLibro">

<div class="mb-3">
<label class="form-label">Título</label>
<input
type="text"
class="form-control"
id="titulo"
aria-label="Título del libro"
required>
</div>

<div class="mb-3">
<label class="form-label">Autor</label>
<input
type="text"
class="form-control"
id="autor"
aria-label="Autor del libro"
required>
</div>

<div class="mb-3">
<label class="form-label">Año</label>
<input
type="number"
class="form-control"
id="anio"
aria-label="Año de publicación"
required>
</div>

<div class="mb-3">
<label class="form-label">Categoría</label>

<select
class="form-select"
id="categoria"
aria-label="Categoría">

<option>Ficción</option>
<option>No ficción</option>
<option>Ciencia</option>
<option>Tecnología</option>
<option>Historia</option>
<option>Literatura</option>
<option>Educación</option>

</select>

</div>

</form>

</div>

<div class="modal-footer">

<button
type="button"
class="btn btn-secondary"
data-bs-dismiss="modal">
Cancelar
</button>

<button
type="button"
class="btn btn-primary"
onclick="agregarLibro()">
Guardar Libro
</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="solucion_semana12.js"></script>

</body>
</html>
